name: Flutter CI (Minimal)

on:
  push:
    branches: [ main, v1.0_dev, v1.1 ]
  pull_request:
    branches: [ main, v1.0_dev, v1.1 ]

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter test || true
      continue-on-error: true
